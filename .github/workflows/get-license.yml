name: Get Unity License

on:
  workflow_dispatch:

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        id: alf
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2022.3.45f1

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install tool
        run: npm install --global unity-license-activate

      - name: Activate license
        env:
          TOTP: ${{ secrets.UNITY_TOTP_KEY }}
        run: |
          ARGS=""
          if [ -n "$TOTP" ]; then ARGS="--authenticator-key $TOTP"; fi
          unity-license-activate "${{ secrets.UNITY_EMAIL }}" "${{ secrets.UNITY_PASSWORD }}" "${{ steps.alf.outputs.filePath }}" $ARGS

      - name: Save UNITY_LICENSE secret
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          F="${ULF_FILE:-$(ls *.ulf | head -1)}"
          gh secret set UNITY_LICENSE --repo "${{ github.repository }}" < "$F"

      - name: Error screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot_error
          path: error.png
